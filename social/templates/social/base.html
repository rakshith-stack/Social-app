<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MySocial</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #1c1e21;
        }

        .navbar {
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #1877f2;
        }

        .nav-right a {
            text-decoration: none;
            margin-left: 20px;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #166fe5;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MySocial
        </div>

        <div class="nav-right">

            {% if user.is_authenticated %}

                <span>
                    Hello, {{ user.username }}
                </span>

                <a href="{% url 'home' %}">
                    Home
                </a>
                <a href="{% url 'users' %}">
                    Find Friends
                </a>
                <a href="{% url 'requests' %}">
                    Friend Requests
                </a>

                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>


    <div class="container">

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
