{% extends "social/base.html" %}

{% block content %}

<div class="card">

    <h2>Login</h2>

    <br>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </p>

</div>

{% endblock %}
